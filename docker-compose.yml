# Single-server deployment: the Flask app behind Caddy, which gets and renews
# a free HTTPS certificate automatically. Run via ./deploy.sh, which sets DOMAIN.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Pinned here because these override .env (copied from .env.example,
      # whose DATABASE=users.db would put the DB inside the container, where
      # it's lost on every rebuild) and keep the proxy's port fixed.
      PORT: "5000"
      DATABASE: /data/users.db
    volumes:
      # Host folders, so accounts and uploads survive rebuilds and reboots.
      - ./data:/data
      - ./uploads:/root/Downloads/upload_login_app
    expose:
      - "5000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      # deploy.sh writes DOMAIN into .env, which Compose loads automatically.
      DOMAIN: ${DOMAIN:?DOMAIN must be set - run ./deploy.sh or add DOMAIN=... to .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
