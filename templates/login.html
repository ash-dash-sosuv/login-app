<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
{% from "_meme.html" import meme %}

<div class="container">
    <h2>Login</h2>

    <form method="POST">
        <input
            type="email"
            name="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">Login</button>
    </form>

    {% if error %}
    <p class="error">{{ error }}</p>
    {{ meme(meme_for(error)) }}
    {% endif %}

    <a href="/register">Create an account</a>
</div>

</body>
</html>
