{# A meme under a message. `m` comes from meme_for(...), meme_by_key(...) or
   meme_for_status(...), and is None when memes are turned off. If the image
   can't load, the figure removes itself rather than showing a broken image. #}
{% macro meme(m) %}
{% if m %}
<figure class="meme">
    <img src="{{ m.url }}" alt="{{ m.alt }}" width="360" referrerpolicy="no-referrer"
         onerror="this.parentNode.remove()">
</figure>
{% endif %}
{% endmacro %}
