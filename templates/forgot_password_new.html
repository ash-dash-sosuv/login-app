{% extends "auth_base.html" %}
{% block title %}Choose a new password{% endblock %}

{% block content %}
{% from "_alerts.html" import alert %}
<span class="auth-eyebrow">Password reset</span>
<h1 class="auth-title">Choose a new password</h1>
<p class="auth-subtitle">For <strong>{{ email }}</strong>. Use at least 8 characters. You'll sign in with it next.</p>

{{ alert(error) }}

<form method="POST" class="auth-form">
    <div class="auth-field">
        <label class="auth-label" for="new_password">New password</label>
        <input class="auth-input" id="new_password" type="password" name="new_password"
               autocomplete="new-password" minlength="8" required autofocus>
    </div>
    <div class="auth-field">
        <label class="auth-label" for="confirm_password">Confirm new password</label>
        <input class="auth-input" id="confirm_password" type="password" name="confirm_password"
               autocomplete="new-password" minlength="8" required>
    </div>
    <button type="submit" class="auth-submit">Change password</button>
</form>

<div class="auth-links">
    <a href="{{ url_for('login') }}">Cancel</a>
</div>
{% endblock %}
